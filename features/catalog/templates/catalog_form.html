{% extends 'base.html' %}

{% block content %}
<h1>{{ 'Edit' if entry else 'Add' }} category</h1>

{% for message in errors.values() %}
<p class="error">{{ message }}</p>
{% endfor %}

<form method="post">
  <label>Category name
    <input name="label"
           value="{{ request.form.get('label', entry.label if entry else '') }}"
           required>
  </label>

  <label>Item type
    {% set selected = request.form.get('item_type', entry.item_type if entry else '') %}
    <select name="item_type" required>
      {% for kind in ['Top', 'Bottom', 'One-piece', 'Shoes'] %}
      <option value="{{ kind }}" {% if selected == kind %}selected{% endif %}>
        {{ kind }}
      </option>
      {% endfor %}
    </select>
  </label>

  <button>Save category</button>
</form>
{% endblock %}
