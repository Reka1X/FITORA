{% extends 'base.html' %}
{% block content %}
<h1>Edit profile</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>Name<input name="full_name" value="{{ user.full_name }}" required></label>
  <label>Email<input type="email" name="email" value="{{ user.email }}" required></label>
  <button>Save</button>
</form>
{% endblock %}
