{% extends 'base.html' %}
{% block content %}
<h1>{{ schedule.outfit_name }}</h1>
<p>{{ schedule.describe() }}</p>
<p>Type: {{ schedule.schedule_type }}</p>
{% if schedule.note %}<p>Note: {{ schedule.note }}</p>{% endif %}

<p><a href="{{ url_for('calendar.edit', schedule_id=schedule.id) }}">Edit schedule</a></p>

<form method="post"
      action="{{ url_for('calendar.mark_worn', schedule_id=schedule.id) }}">
  <button>Mark as worn</button>
</form>

<form method="post"
      action="{{ url_for('calendar.delete', schedule_id=schedule.id) }}">
  <button>Delete schedule</button>
</form>
{% endblock %}
